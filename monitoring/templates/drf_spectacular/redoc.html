{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    {% block head %}
    <title>API · HidroMonitor — Redoc</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'monitoring/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="{% static 'monitoring/docs.css' %}">
    {% endblock head %}
  </head>
  <body class="hm-redoc">
    {% block body %}
    {% include "monitoring/docs_header.html" with current="redoc" %}
    {% if settings %}
    <div id="redoc-container"></div>
    <script src="{{ redoc_standalone }}"></script>
    <script>
      const redocSettings = {{ settings|safe }};
      Redoc.init("{{ schema_url }}", redocSettings, document.getElementById('redoc-container'))
    </script>
    {% else %}
    <redoc spec-url="{{ schema_url }}"></redoc>
    <script src="{{ redoc_standalone }}"></script>
    {% endif %}
    {% endblock body %}
  </body>
</html>
